<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Inicia sesión en Guess Colors para registrar tus puntuaciones.">
  <title>Login · Guess Colors</title>
  <link rel="stylesheet" href="lib/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <header class="site-header">
    <nav class="navbar navbar-expand-md container py-3 site-nav">
      <a class="navbar-brand" href="index.html">
        <img class="brand-logo" src="img/miw.png" alt="MIW">
        <span class="brand-dots">
          <span style="background:#ef4444"></span>
          <span style="background:#22c55e"></span>
          <span style="background:#3b82f6"></span>
          <span style="background:#eab308"></span>
          <span style="background:#f8fafc"></span>
        </span>
        Guess Colors
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse site-nav-groups" id="mainNav">
        <ul class="navbar-nav nav-group">
          <li class="nav-item"><a class="nav-link" href="index.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="play.html">Jugar</a></li>
          <li class="nav-item"><a class="nav-link" href="records.html">Records</a></li>
        </ul>
        <ul class="navbar-nav nav-group">
          <li class="nav-item"><a class="nav-link" href="register.html">Registro</a></li>
          <li class="nav-item"><a class="nav-link active" href="login.html">Login</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <main class="container">
    <section class="surface p-4 p-md-5 form-narrow">
      <h1 class="page-title h3 mb-1">Identificación de usuario</h1>
      <p class="page-subtitle mb-4">
        Accede con tu usuario y contraseña.
      </p>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="username">Usuario</label>
          <input class="form-control" type="text" id="username" name="username" required>
        </div>

        <div class="mb-4">
          <label class="form-label" for="password">Contraseña</label>
          <input class="form-control" type="password" id="password" name="password" required>
        </div>

        <button class="btn btn-primary w-100" type="submit">Entrar</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    Prácticas de Front-end para Navegadores Web · Máster en Ingeniería Web · E.T.S.I. Sistemas Informáticos (U.P.M.)
  </footer>

  <script src="lib/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/services/AuthStorage.js"></script>
  <script src="js/api/ApiClient.js"></script>
  <script src="js/views/LoginView.js"></script>
  <script src="js/pages/login.js"></script>
</body>

</html>
